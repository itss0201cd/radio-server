[package]
name = "radio-station"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
bytes = "1"
rand = "0.10.3"
argon2 = "0.6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
# The account worker contains panics with catch_unwind (proofs/Auth.lean).
panic = "unwind"
